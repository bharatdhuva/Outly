name: Keep Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Server
        run: |
          curl -s https://outly.online/api/auth/ping || true
