    <script>
      (function() {
        try {
          var avatar = localStorage.getItem("outly_user_avatar");
          if (avatar) {
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = avatar;
            link.fetchPriority = "high";
            document.head.appendChild(link);
          }
        } catch(e) {}
      })();
    </script>
